name: desktop

# 桌面三平台：编译 + 单元测试（路线图 P0-T7 / P5-T6）
# 本工作流不需要任何密钥。公开仓库可免费无限运行（含 macOS runner）。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu / debug + ASan+UBSan
            os: ubuntu-latest
            build_type: Debug
            sanitize: "ON"
          - name: ubuntu / release
            os: ubuntu-latest
            build_type: Release
            sanitize: "OFF"
          - name: macos / release
            os: macos-latest
            build_type: Release
            sanitize: "OFF"
          - name: windows / release
            os: windows-latest
            build_type: Release
            sanitize: "OFF"

    steps:
      - uses: actions/checkout@v4

      # SDL3 / SDL3_ttf 由 FetchContent 从源码编译，需要系统图形/输入开发库。
      # SDL3 在 Linux 上对 9 项 X11 扩展做 FATAL 检查（cmake/sdlchecks.cmake），
      # 缺任何一个都会使 configure 直接失败，必须逐个装齐：
      #   XCURSOR(libxcursor-dev) XDBE/XSYNC/XSHAPE(libxext-dev)
      #   XINPUT(libxi-dev) XFIXES(libxfixes-dev) XRANDR(libxrandr-dev)
      #   XSCRNSAVER(libxss-dev) XTEST(libxtst-dev)
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libdecor-0-dev \
            libfribidi-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libunwind-dev

      - name: 配置（Configure）
        id: configure
        shell: bash
        run: |
          # CI 无本地依赖缓存（.tools 不入库），因此走网络获取：
          # GitHub runner 访问 GitHub 是内网速度，不受开发者本地网络影响。
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCJING_SANITIZE=${{ matrix.sanitize }}

      - name: 编译（Build）
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: 单元测试（Test）
        shell: bash
        run: |
          # 注意：LeakSanitizer 仅 Linux 支持；macOS 上开启 detect_leaks 会报 unsupported
          # runner 没有音频硬件：强制 dummy 音频驱动，
          # 避免真实后端（pulse/alsa）在 LeakSanitizer 下报出 SDL 内部泄漏，
          # 也避免音频设备探测拖慢测试。
          export SDL_AUDIODRIVER=dummy
          if [ "${{ matrix.sanitize }}" = "ON" ]; then
            export ASAN_OPTIONS=detect_leaks=1
            export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          fi
          ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

      - name: core/ 纯净性检查（架构原则 1）
        run: cmake --build build --target core_purity_check

      # 失败时上传日志，便于定位（公开仓库可通过 artifact 下载，无需仓库 admin 权限）
      - name: 收集失败日志
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          echo "===== 环境摘要 =====" > ci-logs/summary.txt
          { cmake --version; echo; uname -a || true; echo; } >> ci-logs/summary.txt 2>&1 || true
          for f in CMakeCache.txt CMakeFiles/CMakeConfigureLog.yaml \
                   CMakeFiles/CMakeError.log CMakeFiles/CMakeOutput.log; do
            if [ -f "build/$f" ]; then cp "build/$f" ci-logs/ || true; fi
          done

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ strategy.job-index }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7
