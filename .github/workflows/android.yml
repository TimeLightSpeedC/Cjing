# Android 构建验证（路线图 P3-T1/T2）
#
# 目的：在没有本地 Android SDK 的机器上也能验证"工程能编译出 APK"。
# 只做构建，不做真机测试 —— 真机测试需要 adb 连接的设备（本地进行）。
name: Android

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: android / debug apk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 35 与 NDK 28.2
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: 准备工程（源码链接 + assets）
        run: ./android/setup.sh

      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cjing-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
